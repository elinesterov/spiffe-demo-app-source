name: Build, Push and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2


      - uses: actions/setup-go@v2
        with:
          go-version: '1.20.x'
      - uses: actions/checkout@v2

      - uses: ko-build/setup-ko@v0.6
      - run: ko build